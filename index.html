<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Mission 99</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:760px;margin:auto;padding:18px 14px 40px}.top{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:16px}
h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
input,button{font:inherit}input[type=number],input[type=time],input[type=date]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}
button{min-height:44px;border:0;border-radius:10px;padding:9px 13px;background:var(--accent);color:#fff;font-weight:700}
button.secondary{background:#eef0f3;color:#111827}.section{font-weight:800;margin-bottom:10px}.q{display:grid;grid-template-columns:1fr 82px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:0}.q small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.score{font-size:34px;font-weight:900}.pillars{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.pillar{padding:12px;background:#f8f9fa;border-radius:12px}.pillar b{display:block;font-size:20px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f8f9fa;border-radius:12px;padding:12px}.stat b{display:block;font-size:18px}.history{max-height:360px;overflow:auto}.hist{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.hist-info{flex:1;cursor:pointer}.hist-actions{display:flex;gap:5px}.hist-actions button{min-height:36px;padding:6px 9px;font-size:12px}.hist-actions .edit{background:#111827}.hist-actions .del{background:#b42318}
.note{width:100%;min-height:70px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{background:#b42318}
@media(max-width:480px){.pillars{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.q{grid-template-columns:1fr 76px}}

.chartBox{margin-top:12px;padding:12px;background:#f8f9fa;border-radius:12px}
.barRow{display:grid;grid-template-columns:125px 1fr 58px;gap:8px;align-items:center;margin:9px 0;font-size:12px}
.barTrack{height:18px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.barFill{height:100%;background:#111827;border-radius:99px;transition:width .25s ease}
.chartTitle{font-weight:800;margin-bottom:8px}
@media(max-width:480px){.barRow{grid-template-columns:105px 1fr 52px;font-size:11px}}

.quickScore{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;margin-top:4px}
.quickScore button{min-height:38px;padding:0;border-radius:8px;background:#eef0f3;color:#111827;font-size:13px}
.quickScore button.selected{background:#111827;color:#fff}
.q{display:block!important;padding:10px 0!important}
.qLabel{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.qLabelText{flex:1}
@media(max-width:480px){.quickScore{gap:2px}.quickScore button{min-height:36px;font-size:12px}}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>⚔️ Mission 99</h1><div class="sub">99 days • 210 points/day</div></div><div class="score" id="total">0/210</div></div>

<div class="card">
  <div class="row">
    <div class="grow"><label class="sub">Day</label><input id="day" type="number" min="1" max="99" value="1"></div>
    <div class="grow"><label class="sub">Date</label><input id="date" type="date"></div>
  </div>
</div>

<div id="sections"></div>

<div class="card">
  <div class="section">📚 Study time</div>
  <div class="row">
    <div class="grow"><label class="sub">Hours</label><input id="studyH" type="number" min="0" max="24" value="0"></div>
    <div class="grow"><label class="sub">Minutes</label><input id="studyM" type="number" min="0" max="59" value="0"></div>
  </div>
</div>

<div class="card">
  <div class="section">💤 Sleep</div>
  <div class="row">
    <div class="grow"><label class="sub">Bedtime</label><input id="bed" type="time"></div>
    <div class="grow"><label class="sub">Wake-up</label><input id="wake" type="time"></div>
  </div>
  <div class="sub" style="margin-top:8px">Sleep duration: <b id="sleepDur">—</b></div>
</div>

<div class="card">
  <div class="section">🌙 Debrief</div>
  <div><label class="sub">🏆 Biggest win</label><textarea id="win" class="note"></textarea></div><br>
  <div><label class="sub">🧠 Lesson / fix</label><textarea id="lesson" class="note"></textarea></div><br>
  <div><label class="sub">🎯 Tomorrow's 1–3 non-negotiables</label><textarea id="tomorrow" class="note"></textarea></div>
</div>

<div class="card">
  <div class="section">📊 Today</div>
  <div class="pillars" id="pillars"></div>
</div>

<div class="card">
  <div class="section">📈 Mission progress</div>
  <div class="stats" id="stats"></div>
</div>

<div class="card">
  <div class="section">🗓️ History</div>
  <div class="history" id="history"></div>
</div>


<div class="card">
  <div class="section">🔎 REVIEW A DAY</div>
  <div class="row">
    <div class="grow">
      <label class="sub">Enter Day number</label>
      <input id="reviewDay" type="number" min="1" max="99" value="1">
    </div>
    <button id="reviewBtn">Review day</button>
  </div>
  <div id="dayReview" style="margin-top:12px"></div>
</div>

<div class="card">
  <div class="section">📅 WEEKLY REPORT</div>
  <div class="row">
    <div class="grow">
      <label class="sub">Mission week</label>
      <select id="weekSelect" style="width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;font-size:16px"></select>
    </div>
    <button id="weekBtn">View week</button>
  </div>
  <div id="weekReport" style="margin-top:12px"></div>
</div>

<div class="card">
  <div class="section">🗓️ MONTHLY REPORT</div>
  <div class="row">
    <div class="grow">
      <label class="sub">Month</label>
      <select id="monthSelect" style="width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;font-size:16px"></select>
    </div>
    <button id="monthBtn">View month</button>
  </div>
  <div id="monthReport" style="margin-top:12px"></div>
</div>

<div class="card">
  <div class="section">🏁 OVERALL REPORT — MISSION 99</div>
  <button id="overallBtn">Generate overall report</button>
  <div id="overallReport" style="margin-top:12px"></div>
</div>

<div class="actions">
  <button class="secondary" id="installBtn" style="display:none" onclick="installApp()">📱 Install App</button>
  <button id="load">Load day</button>
  <button id="save">Save day</button>
  <button class="danger" id="deleteDay">🗑️ Delete this day</button>
  <button class="secondary" id="new">New day</button>
  <button class="secondary" id="export">Export data</button>
  <button class="danger" id="clear">Clear all</button>
</div>
</main>
<script>
const dataKey="mission99-v1";
const sections=[
 ["🧬 Character",50,[
  "Discipline — Did I do what needed to be done?",
  "Courage — Did I face discomfort instead of avoiding it?",
  "Confidence — Did I carry myself with confidence and assertiveness?",
  "Self-control — Did I control my ego, anger and reactions?",
  "Integrity — Did my actions match my standards?"
 ]],
 ["👨‍👩‍👦🧠 Family + Mental Control",50,[
  "Family presence — Was I genuinely present with my family?",
  "Family contribution — Did I meaningfully help my family?",
  "Mental clarity — Did I control negative and pointless thought loops?",
  "Mental presence — Was my mind where my body was?",
  "Digital control — Did I control pointless phone/social-media use?"
 ]],
 ["📚 Study",40,[
  "Completion — Did I complete my planned study?",
  "Focus — Was I genuinely focused?",
  "Learning — Did I actively understand and test myself?",
  "Revision — Did I revise what I learned?"
 ]],
 ["🏗️ Work",40,[
  "Ownership — Did I fully own my responsibilities?",
  "Initiative — Did I identify and solve problems proactively?",
  "Execution — Did I finish what actually mattered?",
  "Preparation — Did I prepare tomorrow's work?"
 ]],
 ["💪 Body",30,[
  "Training — Did I complete my planned training?",
  "Nutrition — Did I eat according to my goals?",
  "Recovery — Did I protect my sleep and recovery?"
 ]]
];
const questions=sections.flatMap((s,si)=>s[2].map((q,qi)=>({q,si,qi})));
const $=id=>document.getElementById(id);
let records=JSON.parse(localStorage.getItem(dataKey)||"[]");

function todayISO(){return new Date().toISOString().slice(0,10)}
$("date").value=todayISO();
$("day").addEventListener("change",()=>{ const d=Math.max(1,Math.min(99,Number($("day").value)||1)); $("day").value=d; $("reviewDay").value=d; });

function render(){
 let root=$("sections"); root.innerHTML="";
 let n=0;
 sections.forEach((s,si)=>{
  const card=document.createElement("div"); card.className="card";
  card.innerHTML=`<div class="section">${s[0]} — /${s[1]}</div><div class="sub">Tap a number from 0–10 for each item.</div>`;
  s[2].forEach((q,qi)=>{
   const idx=n++;
   const div=document.createElement("div"); div.className="q";
   const label=document.createElement("div"); label.className="qLabel";
   label.innerHTML=`<div class="qLabelText">${idx+1}. ${q}</div><b class="currentMark" data-current="${idx}">0</b>`;
   div.appendChild(label);
   const quick=document.createElement("div"); quick.className="quickScore";
   for(let n=0;n<=10;n++){
     const b=document.createElement("button"); b.type="button"; b.textContent=n;
     b.dataset.value=n; b.dataset.index=idx;
     b.onclick=()=>{ setMark(idx,n); };
     quick.appendChild(b);
   }
   const hidden=document.createElement("input"); hidden.type="hidden"; hidden.value="0"; hidden.dataset.si=si; hidden.dataset.qi=qi; hidden.className="mark";
   div.appendChild(quick); div.appendChild(hidden);
   card.appendChild(div);
  });
  root.appendChild(card);
 });
 document.querySelectorAll(".mark").forEach(x=>x.addEventListener("input",update));
}
render();


function setMark(idx,value){
  const inputs=[...document.querySelectorAll(".mark")];
  if(!inputs[idx])return;
  inputs[idx].value=value;
  document.querySelectorAll(`button[data-index="${idx}"]`).forEach(b=>b.classList.toggle("selected",Number(b.dataset.value)===value));
  const c=document.querySelector(`[data-current="${idx}"]`); if(c)c.textContent=value;
  calc();
}
function marks(){return [...document.querySelectorAll(".mark")].map(x=>Math.max(0,Math.min(10,Number(x.value)||0)))}
function calc(){
 const m=marks(); let pos=0,total=0,p=[];
 sections.forEach(s=>{let sum=0;for(let i=0;i<s[2].length;i++)sum+=m[pos++];p.push(sum);total+=sum});
 $("total").textContent=total+"/210";
 $("pillars").innerHTML=sections.map((s,i)=>`<div class="pillar">${s[0]}<b>${p[i]}/${s[1]}</b></div>`).join("");
 updateSleep(); return {m,total,p};
}
function update(){calc()}
function syncQuickScores(){
  const inputs=[...document.querySelectorAll(".mark")];
  inputs.forEach((x,i)=>{
    const v=Number(x.value)||0;
    document.querySelectorAll(`button[data-index="${i}"]`).forEach(b=>b.classList.toggle("selected",Number(b.dataset.value)===v));
    const c=document.querySelector(`[data-current="${i}"]`); if(c)c.textContent=v;
  });
}
function updateSleep(){
 const b=$("bed").value,w=$("wake").value;
 if(!b||!w){$("sleepDur").textContent="—";return}
 let [bh,bm]=b.split(":").map(Number),[wh,wm]=w.split(":").map(Number);
 let a=bh*60+bm,c=wh*60+wm;if(c<=a)c+=1440;
 let d=c-a;$("sleepDur").textContent=Math.floor(d/60)+"h "+(d%60)+"m";
}
["bed","wake","studyH","studyM"].forEach(id=>$(id).addEventListener("input",updateSleep));

function formData(){
 const c=calc();
 return {day:Number($("day").value),date:$("date").value,marks:c.m,total:c.total,pillars:c.p,
 studyH:Number($("studyH").value)||0,studyM:Number($("studyM").value)||0,bed:$("bed").value,wake:$("wake").value,
 win:$("win").value,lesson:$("lesson").value,tomorrow:$("tomorrow").value};
}
function save(){
 const d=formData(),i=records.findIndex(r=>r.day===d.day);
 if(i>=0)records[i]=d;else records.push(d);
 records.sort((a,b)=>a.day-b.day);localStorage.setItem(dataKey,JSON.stringify(records));renderHistory();renderStats();reviewDay();weeklyReport();monthlyReport();overallReport();
}
function renderHistory(){
 $("history").innerHTML=records.length?records.map(r=>`<div class="hist">
   <span class="hist-info" data-review="${r.day}"><b>Day ${r.day}</b> • ${r.date}<br><span class="sub">Score: ${r.total}/210</span></span>
   <div class="hist-actions">
     <button class="edit" data-edit-day="${r.day}">✏️ Edit</button>
     <button class="del" data-delete-day="${r.day}">🗑️</button>
   </div>
 </div>`).join(""):"<div class='sub'>No saved days yet.</div>";
 document.querySelectorAll("[data-review]").forEach(el=>el.onclick=()=>{ $("reviewDay").value=el.dataset.review; reviewDay(); window.scrollTo({top:document.getElementById("dayReview").getBoundingClientRect().top+window.scrollY-20,behavior:"smooth"}); });
 document.querySelectorAll("[data-edit-day]").forEach(el=>el.onclick=()=>editDay(Number(el.dataset.editDay)));
 document.querySelectorAll("[data-delete-day]").forEach(el=>el.onclick=()=>deleteSavedDay(Number(el.dataset.deleteDay)));
}
function editDay(d){
  $("day").value=d;
  loadSavedDay();
  $("reviewDay").value=d;
  reviewDay();
  window.scrollTo({top:0,behavior:"smooth"});
  alert("Day "+d+" loaded for editing. Change anything you want, then tap Save day.");
}
function deleteSavedDay(d){
  const exists=records.some(r=>r.day===d);
  if(!exists){alert("There is no saved entry for Day "+d+".");return;}
  if(confirm("Delete the saved entry for Day "+d+"? This cannot be undone.")){
    records=records.filter(r=>r.day!==d);
    localStorage.setItem(dataKey,JSON.stringify(records));
    resetForm(d); renderHistory(); renderStats(); reviewDay(); weeklyReport(); monthlyReport(); overallReport();
    alert("Day "+d+" deleted.");
  }
}
function renderStats(){
 let n=records.length,avg=n?Math.round(records.reduce((a,r)=>a+r.total,0)/n):0,best=n?Math.max(...records.map(r=>r.total)):0;
 $("stats").innerHTML=`<div class="stat">Days logged<b>${n}/99</b></div><div class="stat">Average<b>${avg}/210</b></div><div class="stat">Best day<b>${best}/210</b></div>`;
}
function resetForm(day){
 $("day").value=day; $("date").value=todayISO();
$("day").addEventListener("change",()=>{ const d=Math.max(1,Math.min(99,Number($("day").value)||1)); $("day").value=d; $("reviewDay").value=d; });
 document.querySelectorAll(".mark").forEach(x=>x.value=0);
 ["studyH","studyM"].forEach(id=>$(id).value=0);["bed","wake"].forEach(id=>$(id).value="");
 ["win","lesson","tomorrow"].forEach(id=>$(id).value="");calc();syncQuickScores();
}
function loadSavedDay(){
  const d=Math.max(1,Math.min(99,Number($("day").value)||1));
  const r=records.find(x=>x.day===d);
  if(!r){ alert("No saved entry for Day "+d+"."); return; }
  $("date").value=r.date||todayISO();
  document.querySelectorAll(".mark").forEach((x,i)=>x.value=r.marks?.[i]??0);
  $("studyH").value=r.studyH||0; $("studyM").value=r.studyM||0;
  $("bed").value=r.bed||""; $("wake").value=r.wake||"";
  $("win").value=r.win||""; $("lesson").value=r.lesson||""; $("tomorrow").value=r.tomorrow||"";
  calc();
}
$("load").onclick=()=>{loadSavedDay(); $("reviewDay").value=$("day").value; reviewDay();};
$("save").onclick=()=>{save();alert("Mission 99 Day "+$("day").value+" saved.");};
$("deleteDay").onclick=()=>{
  const d=Math.max(1,Math.min(99,Number($("day").value)||1));
  const exists=records.some(r=>r.day===d);
  if(!exists){alert("There is no saved entry for Day "+d+".");return;}
  if(confirm("Delete the saved entry for Day "+d+"? This cannot be undone.")){
    records=records.filter(r=>r.day!==d);
    localStorage.setItem(dataKey,JSON.stringify(records));
    resetForm(d); renderHistory(); renderStats(); reviewDay(); weeklyReport(); monthlyReport(); overallReport();
    alert("Day "+d+" deleted.");
  }
};
$("new").onclick=()=>resetForm(Math.min(99,Number($("day").value||1)+1));
$("export").onclick=()=>{const blob=new Blob([JSON.stringify(records,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mission99-data.json";a.click();URL.revokeObjectURL(a.href)};
$("clear").onclick=()=>{if(confirm("Clear all saved Mission 99 data?")){records=[];localStorage.removeItem(dataKey);renderHistory();renderStats();resetForm(1);reviewDay();weeklyReport();monthlyReport();overallReport()}};

function fmtMinutes(total){
  total=Math.max(0,Number(total)||0);
  return Math.floor(total/60)+"h "+(total%60)+"m";
}
function sleepMinutes(b,w){
  if(!b||!w)return 0;
  const a=b.split(":").map(Number), c=w.split(":").map(Number);
  let x=a[0]*60+a[1], y=c[0]*60+c[1];
  if(y<=x)y+=1440;
  return y-x;
}
function recForDay(d){return records.find(r=>Number(r.day)===Number(d));}

function barChart(items,title,maxValue){
  if(!items.length)return "";
  return `<div class="chartBox"><div class="chartTitle">${title}</div>`+
    items.map(x=>`<div class="barRow"><span>${x.label}</span><div class="barTrack"><div class="barFill" style="width:${Math.max(0,Math.min(100,(x.value/maxValue)*100))}%"></div></div><b>${x.display??x.value}</b></div>`).join("")+
    `</div>`;
}
function pillarChart(list,title){
  if(!list.length)return "";
  const sums=[0,0,0,0,0];
  list.forEach(r=>r.pillars.forEach((v,i)=>sums[i]+=v));
  return barChart(sums.map((v,i)=>({label:sections[i][0].replace(/^.{1,2}/,"").trim(),value:Math.round(v/list.length),display:Math.round(v/list.length)+"/"+sections[i][1]})),title,10);
}
function reportRange(list,title){
  const logged=list.length;
  if(!logged)return `<div class="sub">No saved days in ${title}.</div>`;
  const total=list.reduce((a,r)=>a+r.total,0);
  const avg=Math.round(total/logged);
  const sums=[0,0,0,0,0];
  list.forEach(r=>r.pillars.forEach((v,i)=>sums[i]+=v));
  const avgP=sums.map((v,i)=>`${sections[i][0]}: ${Math.round(v/logged)}/${sections[i][1]}`).join("<br>");
  const study=list.reduce((a,r)=>a+(r.studyH*60+r.studyM),0);
  const sleep=list.reduce((a,r)=>a+sleepMinutes(r.bed,r.wake),0);
  const avgSleep=Math.round(sleep/logged);
  const highest=list.reduce((a,b)=>b.total>a.total?b:a);
  const lowest=list.reduce((a,b)=>b.total<a.total?b:a);
  const pillarBar=pillarChart(list,"Average pillar score (out of 10)",10);
  return `<div class="stat" style="margin-bottom:8px"><b>${logged} day${logged===1?"":"s"} logged</b><br>Average score: <b>${avg}/210</b><br>Total points: <b>${total}</b><br>Study time: <b>${fmtMinutes(study)}</b><br>Average sleep: <b>${fmtMinutes(avgSleep)}</b><br>Highest recorded day: <b>Day ${highest.day} — ${highest.total}/210</b><br>Lowest recorded day: <b>Day ${lowest.day} — ${lowest.total}/210</b></div><div class="pillar">${avgP}</div>${pillarBar}`;
}
function reviewDay(){
  const d=Math.max(1,Math.min(99,Number($("reviewDay").value)||1)); $("reviewDay").value=d;
  const r=recForDay(d);
  if(!r){$("dayReview").innerHTML="<div class='sub'>Day "+d+" has not been saved yet.</div>";return;}
  const scores=r.pillars.map((v,i)=>`${sections[i][0]}: <b>${v}/${sections[i][1]}</b>`).join("<br>");
  const sleep=fmtMinutes(sleepMinutes(r.bed,r.wake));
  const dailyChart=barChart(r.pillars.map((v,i)=>({label:sections[i][0].replace(/^.{1,2}/,"").trim(),value:(v/sections[i][1])*10,display:v+"/"+sections[i][1]})),"Daily pillar performance",10);
  $("dayReview").innerHTML=`<div class="stat"><b>Day ${r.day} • ${r.date}</b><br><span class="score">${r.total}/210</span><br>${scores}<br><br>📚 Study: <b>${r.studyH}h ${r.studyM}m</b><br>💤 Sleep: <b>${sleep}</b><br>Bed: ${r.bed||"—"} • Wake: ${r.wake||"—"}<br><br>🏆 Win: ${r.win||"—"}<br>🧠 Lesson: ${r.lesson||"—"}<br>🎯 Tomorrow: ${r.tomorrow||"—"}</div>${dailyChart}<div class="sub" style="margin-top:8px">Individual marks: ${r.marks.join(" • ")}</div>`;
}
function initReportSelectors(){
  const ws=$("weekSelect"); ws.innerHTML="";
  for(let w=1;w<=15;w++){let start=(w-1)*7+1,end=Math.min(99,w*7);ws.innerHTML+=`<option value="${w}">Week ${w} — Days ${start}-${end}</option>`;}
  const ms=$("monthSelect"); ms.innerHTML="";
  [["September 2026",9,2026],["October 2026",10,2026],["November 2026",11,2026],["December 2026",12,2026]].forEach((x,i)=>ms.innerHTML+=`<option value="${i}">${x[0]}</option>`);
}
function weeklyReport(){
  const w=Number($("weekSelect").value||1), start=(w-1)*7+1,end=Math.min(99,w*7);
  const list=records.filter(r=>r.day>=start&&r.day<=end);
  const chart=barChart(list.map(r=>({label:"Day "+r.day,value:r.total,display:r.total+"/210"})),"Daily score this week",210);
  $("weekReport").innerHTML=reportRange(list,`Week ${w}`)+chart;
}
function monthlyReport(){
  const names=[["September 2026",2026,8],["October 2026",2026,9],["November 2026",2026,10],["December 2026",2026,11]];
  const [name,y,m]=names[Number($("monthSelect").value||0)];
  const list=records.filter(r=>{const d=new Date(r.date+"T00:00:00");return d.getFullYear()===y&&d.getMonth()===m;});
  const chart=barChart(list.map(r=>({label:"Day "+r.day,value:r.total,display:r.total+"/210"})),"Daily scores this month",210);
  $("monthReport").innerHTML=reportRange(list,name)+chart;
}
function overallReport(){
  const chart=barChart(records.map(r=>({label:"D"+r.day,value:r.total,display:r.total+"/210"})),"Mission 99 daily scores",210);
  $("overallReport").innerHTML=reportRange(records,"the mission")+chart;
}
$("reviewBtn").onclick=reviewDay;
$("weekBtn").onclick=weeklyReport;
$("monthBtn").onclick=monthlyReport;
$("overallBtn").onclick=overallReport;
initReportSelectors();
reviewDay();
weeklyReport();
monthlyReport();
overallReport();

renderHistory();renderStats();calc();
</script>

<script>
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const b=document.getElementById('installBtn');
  if(b) b.style.display='inline-block';
});
async function installApp(){
  if(!deferredInstallPrompt){ alert('If Chrome offers “Add to Home screen”, choose it from the browser menu.'); return; }
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt=null;
}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body></html>
