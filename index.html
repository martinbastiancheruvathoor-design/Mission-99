:root{--bg:#eef1f5;--card:#fff;--ink:#0b1220;--muted:#667085;--line:#e5e7eb;--navy:#0b1220;--blue:#2563eb;--bluebg:#dbeafe;--red:#dc2626;--shadow:0 10px 28px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fafc,#eef1f5);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}button,input,textarea,select{font:inherit}main{max-width:760px;margin:auto;padding:12px 10px 42px}.hero{color:#fff;background:linear-gradient(145deg,#0b1220,#1a2940);border-radius:27px;padding:18px;box-shadow:0 16px 38px rgba(11,18,32,.2)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:24px;font-weight:950}.sub{font-size:11px;color:#aeb9ca;margin-top:3px}.badge{padding:7px 10px;border:1px solid #ffffff22;background:#ffffff12;border-radius:99px;font-size:11px;font-weight:900}.heroMain{display:grid;grid-template-columns:1fr 104px;gap:15px;align-items:center;margin-top:18px}.heroTitle{font-size:11px;color:#aeb9ca;font-weight:800;letter-spacing:.5px}.heroDate{font-size:14px;font-weight:800;margin-top:4px}.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#60a5fa var(--p,0%),#ffffff18 0);position:relative}.ring:before{content:"";position:absolute;inset:9px;border-radius:50%;background:#111b2d}.ringIn{position:relative;text-align:center}.big{font-size:24px;font-weight:950;line-height:1}.small{font-size:9px;color:#aeb9ca;margin-top:3px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:17px}.darkField{background:#ffffff0d;border:1px solid #ffffff18;border-radius:13px;padding:7px 10px}.darkField label{display:block;font-size:9px;color:#aeb9ca}.darkField input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-weight:900;padding:2px 0}.darkField input::-webkit-calendar-picker-indicator{filter:invert(1)}
.pillar{margin-top:11px;background:var(--card);border-radius:21px;border:1px solid #0f172a0d;box-shadow:var(--shadow);overflow:hidden}.pillarHead{width:100%;display:flex;align-items:center;gap:11px;padding:15px;background:transparent;border:0;text-align:left;color:var(--ink)}.ico{width:43px;height:43px;border-radius:14px;background:#f3f5f8;display:grid;place-items:center;font-size:21px}.name{font-size:16px;font-weight:950}.hint{font-size:10px;color:var(--muted);margin-top:2px}.pscore{margin-left:auto;font-size:17px;font-weight:950;white-space:nowrap}.chev{width:28px;height:28px;border-radius:50%;background:#f1f3f6;display:grid;place-items:center}.pillar.open .chev{transform:rotate(180deg);background:var(--bluebg);color:var(--blue)}.body{display:none;border-top:1px solid var(--line);padding:0 14px 12px}.pillar.open .body{display:block}.q{padding:14px 0;border-bottom:1px solid var(--line)}.q:last-child{border-bottom:0}.qtop{display:flex;gap:9px;align-items:flex-start}.num{width:25px;height:25px;border-radius:8px;background:#eef2f7;display:grid;place-items:center;font-size:10px;font-weight:900;color:#475467}.qt{flex:1;font-size:13px;font-weight:750;line-height:1.35}.mark{min-width:34px;height:29px;border-radius:10px;background:#eef2f7;display:grid;place-items:center;font-weight:950}.mark.on{background:var(--navy);color:#fff}.scores{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}.scores button{min-height:45px;border:1px solid #dfe4ea;border-radius:11px;background:#f7f8fa;color:#344054;font-weight:950;font-size:14px}.scores button:nth-child(7){grid-column:1}.scores button.sel{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 5px 12px #0b122022}

t:430px;overflow:auto}.hist{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.hist:last-child{border:0}.histTitle{font-weight:900;font-size:12px}.histSub{font-size:10px;color:var(--muted);margin-top:3px}.histActions{display:flex;gap:5px}.histActions button{min-height:38px;border:0;border-radius:10px;padding:5px 9px;font-weight:900}.edit{background:#e0ecff;color:#1d4ed8}.del{background:#fee2e2;color:#b91c1c}.empty{padding:14px 0;color:var(--muted);font-size:11px}.actions{position:sticky;bottom:9px;z-index:10;margin-top:13px;padding:8px;background:#f8fafce8;backdrop-filter:blur(12px);border:1px solid #0f172a12;border-radius:17px;box-shadow:0 10px 28px #0f172a16;display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions button{min-height:48px;border:0;border-radius:12px;font-weight:950}.primary{background:var(--navy);color:#fff}.secondary{background:#e9edf2;color:var(--ink)}.danger{background:#fee2e2;color:#b91c1c}.full{grid-column:1/-1}@media(max-width:390px){main{padding:9px 8px 35px}.hero{padding:16px}.heroMain{grid-template-columns:1fr 94px}.ring{width:94px;height:94px}.scores{gap:5px}.scores button{min-height:43px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style></head><body><main>
<section class="hero"><div class="top"><div><div class="brand">⚔️ Mission 99</div><div class="sub">Measure honestly • Correct daily • Repeat</div></div><div class="badge" id="badgeDay">DAY 1 / 99</div></div><div class="heroMain"><div><div class="heroTitle">TODAY'S PERFORMANCE</div><div class="heroDate" id="heroDate">—</div><div class="sub" style="margin-top:9px">Tap a pillar to open the scorecard.</div></div><div class="ring" id="ring"><div class="ringIn"><div class="big" id="total">0</div><div class="small">/ 210</div></div></div></div><div class="fields"><div class="darkField"><label>DAY</label><input id="day" type="number" min="1" max="99" value="1"></div><div class="darkField"><label>DATE</label><input id="date" type="date"></div></div></section>
<div id="sections"></div>
<section class="fold" id="details"><button class="foldHead"><span>⏱️</span><b>Study, Sleep & Debrief</b><span class="foldHint">Tap to open</span><span class="arrow">⌄</span></button><div class="foldBody"><div class="twocol"><div class="mini"><small>STUDY TIME</small><strong id="studySum">0h 0m</strong></div><div class="mini"><small>SLEEP</small><strong id="sleepDur">—</strong></div></div><div class="inputs"><div class="input"><label>STUDY HOURS</label><input id="studyH" type="number" min="0" max="24" value="0"></div><div class="input"><label>STUDY MINUTES</label><input id="studyM" type="number" min="0" max="59" value="0"></div></div><div class="inputs" style="margin-top:9px"><div class="input"><label>BEDTIME</label><input id="bed" type="time"></div><div class="input"><label>WAKE-UP</label><input id="wake" type="time"></div></div><div class="input"><label>🏆 BIGGEST WIN</label><textarea id="win"></textarea><label>🧠 LESSON / FIX</label><textarea id="lesson"></textarea><label>🎯 TOMORROW'S 1–3 NON-NEGOTIABLES</label><textarea id="tomorrow"></textarea></div></div></section>
<section class="fold" id="reports"><button class="foldHead"><span>📊</span><b>Reports & Charts</b><span class="foldHint">Weekly • Monthly • Overall</span><span class="arrow">⌄</span></button><div class="foldBody"><div class="controls"><select id="weekSelect" class="select"></select><button id="weekBtn">Weekly</button></div><div id="weekReport"></div><div class="controls"><select id="monthSelect" class="select"></select><button id="monthBtn">Monthly</button></div><div id="monthReport"></div><div style="margin-top:10px"><button id="overallBtn" style="width:100%;min-height:45px;border:0;border-radius:11px;background:#0b1220;color:#fff;font-weight:900">🏁 Overall Mission 99</button></div><div id="overallReport"></div></div></section>
<section class="fold" id="historyCard"><button class="foldHead"><span>🗂️</span><b>History & Manage</b><span class="foldHint" id="histHint">0 days</span><span class="arrow">⌄</span></button><div class="foldBody"><div class="history" id="history"></div></div></section>
<section class="fold" id="reviewCard"><button class="foldHead"><span>🔎</span><b>Day Review</b><span class="foldHint">Inspect saved day</span><span class="arrow">⌄</span></button><div class="foldBody"><div class="controls"><input id="reviewDay" class="text" type="number" min="1" max="99" value="1"><button id="reviewBtn">Review</button></div><div id="dayReview"></div></div></section>
<div class="actions"><button class="primary" id="save">✓ Save day</button><button class="secondary" id="new">＋ New day</button><button class="secondary" id="load">↻ Load day</button><button class="danger" id="delete">🗑 Delete day</button><button class="secondary full" id="shareReport">📤 Share daily report</button><button class="secondary" id="txtReport">📄 Save TXT</button><button class="secondary" id="pdfReport">🖨️ PDF / Print</button><button class="secondary full" id="export">⇩ Export data</button><button class="secondary full" id="install" style="display:none">📱 Install Mission 99</button></div>
</main><script>
const key='mission99-v1',$=id=>document.getElementById(id);let records=JSON.parse(localStorage.getItem(key)||'[]');
const sections=[['🧬','Character',50,['Discipline — Did I do what needed to be done?','Courage — Did I face discomfort instead of avoiding it?','Confidence — Did I carry myself with confidence and assertiveness?','Self-control — Did I control my ego, anger and reactions?','Integrity — Did my actions match my standards?']],['👨‍👩‍👦','Family + Mental Control',50,['Family presence — Was I genuinely present with my family?','Family contribution — Did I meaningfully help my family?','Mental clarity — Did I control negative and pointless thought loops?','Mental presence — Was my mind where my body was?','Digital control — Did I control pointless phone/social-media use?']],['📚','Study',40,['Completion — Did I complete my planned study?','Focus — Was I genuinely focused?','Learning — Did I actively understand and test yourself?','Revision — Did I revise what I learned?']],['🏗️','Work',40,['Ownership — Did I fully own my responsibilities?','Initiative — Did I identify and solve problems proactively?','Execution — Did I finish what actually mattered?','Preparation — Did I prepare tomorrow’s work?']],['💪','Body',30,['Training — Did I complete my planned training?','Nutrition — Did I eat according to my goals?','Recovery — Did I protect my sleep and recovery?']]];
function iso(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderSections(){let root=$('sections'),idx=0;root.innerHTML='';sections.forEach((s,si)=>{let el=document.createElement('section');el.className='pillar';el.innerHTML=`<button class="pillarHead"><span class="ico">${s[0]}</span><span><div class="name">${s[1]}</div><div class="hint">${s[3].length} questions • tap to score</div></span><span class="pscore" id="ps${si}">0/${s[2]}</span><span class="chev">⌄</span></button><div class="body"></div>`;let body=el.querySelector('.body');s[3].forEach(q=>{let i=idx++,row=document.createElement('div');row.className='q';row.innerHTML=`<div class="qtop"><span class="num">${i+1}</span><div class="qt">${q}</div><span class="mark" id="mk${i}">0</span></div><div class="scores" id="sc${i}"></div><input class="m" type="hidden" value="0">`;let grid=row.querySelector('.scores');for(let n=0;n<=10;n++){let b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>setMark(i,n);grid.appendChild(b)}body.appendChild(row)});el.querySelector('.pillarHead').onclick=()=>el.classList.toggle('open');root.appendChild(el)})}
function vals(){return[...document.querySelectorAll('.m')].map(x=>Number(x.value)||0)}function setMark(i,v){let a=[...document.querySelectorAll('.m')];a[i].value=v;[...document.querySelectorAll('#sc'+i+' button')].forEach((b,n)=>b.classList.toggle('sel',n===v));$('mk'+i).textContent=v;$('mk'+i).classList.toggle('on',v>0);calc()}
function sleep(b,w){if(!b||!w)return 0;let x=b.split(':').map(Number),y=w.split(':').map(Number),a=x[0]*60+x[1],c=y[0]*60+y[1];if(c<=a)c+=1440;return c-a}function fm(n){return Math.floor((n||0)/60)+'h '+((n||0)%60)+'m'}
function calc(){let m=vals(),p=[],pos=0,total=0;sections.forEach((s,i)=>{let z=0;for(let j=0;j<s[3].length;j++)z+=m[pos++];p.push(z);total+=z;$('ps'+i).textContent=z+'/'+s[2]});$('total').textContent=total;$('ring').style.setProperty('--p',total/210*100+'%');$('badgeDay').textContent='DAY '+(+($('day').value||1))+' / 99';$('heroDate').textContent=$('date').value?new Date($('date').value+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric',year:'numeric'}):'—';$('studySum').textContent=(+$('studyH').value||0)+'h '+(+$('studyM').value||0)+'m';$('sleepDur').textContent=sleep($('bed').value,$('wake').value)?fm(sleep($('bed').value,$('wake').value)):'—';return{m,p,total}}
function sync(){vals().forEach((v,i)=>{[...document.querySelectorAll('#sc'+i+' button')].forEach((b,n)=>b.classList.toggle('sel',n===v));$('mk'+i).textContent=v;$('mk'+i).classList.toggle('on',v>0)});calc()}
function form(){let c=calc();return{day:+$('day').value,date:$('date').value,marks:c.m,total:c.total,pillars:c.p,studyH:+$('studyH').value||0,studyM:+$('studyM').value||0,bed:$('bed').value,wake:$('wake').value,win:$('win').value,lesson:$('lesson').value,tomorrow:$('tomorrow').value}}
function save(){let d=form(),i=records.findIndex(r=>r.day===d.day);if(i<0)records.push(d);else records[i]=d;records.sort((a,b)=>a.day-b.day);localStorage.setItem(key,JSON.stringify(records));renderHistory();reports();reviewDay()}
function reset(day){$('day').value=day;$('date').value=iso();document.querySelectorAll('.m').forEach(x=>x.value=0);['studyH','studyM'].forEach(id=>$(id).value=0);['bed','wake','win','lesson','tomorrow'].forEach(id=>$(id).value='');sync()}
function load(){let d=+$('day').value||1,r=records.find(x=>x.day===d);if(!r){alert('No saved entry for Day '+d+'.');return}$('date').value=r.date||iso();document.querySelectorAll('.m').forEach((x,i)=>x.value=r.marks?.[i]??0);$('studyH').value=r.studyH||0;$('studyM').value=r.studyM||0;$('bed').value=r.bed||'';$('wake').value=r.wake||'';$('win').value=r.win||'';$('lesson').value=r.lesson||'';$('tomorrow').value=r.tomorrow||'';sync()}
function del(d){if(!records.some(r=>r.day===d)){alert('No saved entry for Day '+d+'.');return}if(confirm('Delete the saved entry for Day '+d+'? This cannot be undone.')){records=records.filter(r=>r.day!==d);localStorage.setItem(key,JSON.stringify(records));reset(d);renderHistory();reports();reviewDay()}}
function renderHistory(){let h=$('history');$('histHint').textContent=records.length+' day'+(records.length===1?'':'s');h.innerHTML=records.length?records.map(r=>`<div class="hist"><div data-review="${r.day}"><div class="histTitle">Day ${r.day} · ${esc(r.date)} · ${r.total}/210</div><div class="histSub">Tap to review</div></div><div class="histActions"><button class="edit" data-edit="${r.day}">✏️</button><button class="del" data-del="${r.day}">🗑</button></div></div>`).join(''):'<div class="empty">No saved days yet.</div>';document.querySelectorAll('[data-review]').forEach(e=>e.onclick=()=>{$('reviewDay').value=e.dataset.review;reviewDay();open('reviewCard')});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=()=>{$('day').value=e.dataset.edit;load();window.scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>del(+e.dataset.del))}
function bar(items,title,max){if(!items.length)return'';return`<div class="chart"><b>${title}</b>`+items.map(x=>`<div class="barrow"><span>${esc(x.label)}</span><div class="bar"><div class="fill" style="width:${Math.min(100,x.value/max*100)}%"></div></div><b>${x.display}</b></div>`).join('')+'</div>'}
function range(list,title){if(!list.length)return`<div class="empty">No saved days in ${title}.</div>`;let avg=Math.round(list.reduce((a,r)=>a+r.total,0)/list.length),study=list.reduce((a,r)=>a+r.studyH*60+r.studyM,0),sl=list.reduce((a,r)=>a+sleep(r.bed,r.wake),0),sums=[0,0,0,0,0];list.forEach(r=>r.pillars.forEach((v,i)=>sums[i]+=v));return`<div class="stats"><div class="stat"><small>LOGGED</small><b>${list.length}</b></div><div class="stat"><small>AVERAGE</small><b>${avg}/210</b></div><div class="stat"><small>STUDY</small><b>${fm(study)}</b></div></div>`+bar(sums.map((v,i)=>({label:sections[i][1],value:(v/list.length)/sections[i][2]*10,display:Math.round(v/list.length)+'/'+sections[i][2]})),'Average pillar score',10)+`<div class="empty">Highest: Day ${list.reduce((a,b)=>b.total>a.total?b:a).day} · Lowest: Day ${list.reduce((a,b)=>b.total<a.total?b:a).day} · Average sleep: ${fm(Math.round(sl/list.length))}</div>`}
function reports(){let w=+$('weekSelect').value||1,a=(w-1)*7+1,b=Math.min(99,w*7),wl=records.filter(r=>r.day>=a&&r.day<=b);$('weekReport').innerHTML=range(wl,'Week '+w)+(wl.length?bar(wl.map(r=>({label:'Day '+r.day,value:r.total,display:r.total+'/210'})),'Daily score',210):'');let names=[['September 2026',2026,8],['October 2026',2026,9],['November 2026',2026,10],['December 2026',2026,11]],x=names[+$('monthSelect').value||0],ml=records.filter(r=>{let d=new Date(r.date+'T00:00:00');return d.getFullYear()===x[1]&&d.getMonth()===x[2]});$('monthReport').innerHTML=range(ml,x[0])+(ml.length?bar(ml.map(r=>({label:'Day '+r.day,value:r.total,display:r.total+'/210'})),'Daily score',210):'');$('overallReport').innerHTML=range(records,'Mission 99')+(records.length?bar(records.map(r=>({label:'D'+r.day,value:r.total,display:r.total+'/210'})),'Mission 99 daily scores',210):'')}
function reviewDay(){let d=+$('reviewDay').value||1,r=records.find(x=>x.day===d);$('dayReview').innerHTML=r?`<div class="mini"><small>DAY ${r.day} · ${esc(r.date)}</small><strong>${r.total}/210</strong><div class="empty">${r.pillars.map((v,i)=>sections[i][0]+' '+sections[i][1]+': <b>'+v+'/'+sections[i][2]+'</b>').join('<br>')}<br><br>📚 Study ${r.studyH}h ${r.studyM}m · 💤 Sleep ${fm(sleep(r.bed,r.wake))}<br><br>🏆 ${esc(r.win||'—')}<br>🧠 ${esc(r.lesson||'—')}<br>🎯 ${esc(r.tomorrow||'—')}</div></div>`:`<div class="empty">Day ${d} has not been saved yet.</div>`}
function dailyReportText(){let r=form(), lines=['⚔️ MISSION 99 — DAILY REPORT','DAY '+r.day+' / 99','DATE: '+(r.date||'—'),'','🔥 TOTAL: '+r.total+'/210',''];let pos=0;sections.forEach((s,i)=>{lines.push(s[0]+' '+s[1].toUpperCase()+': '+r.pillars[i]+'/'+s[2]);s[3].forEach((q,j)=>{lines.push('   '+(j+1)+'. '+q+' — '+r.marks[pos++]+'/10')});lines.push('')});lines.push('📚 STUDY TIME: '+r.studyH+'h '+r.studyM+'m','💤 SLEEP: '+(sleep(r.bed,r.wake)?fm(sleep(r.bed,r.wake)):'—'),'🛏️ BED: '+(r.bed||'—'),'⏰ WAKE: '+(r.wake||'—'),'','🏆 WIN: '+(r.win||'—'),'🧠 LESSON: '+(r.lesson||'—'),'🎯 TOMORROW: '+(r.tomorrow||'—'),'','Measure honestly • Correct daily • Repeat','— Mission 99');return lines.join('\n')}
function shareDailyReport(){let text=dailyReportText();if(navigator.share){navigator.share({title:'Mission 99 — Day '+form().day, text}).catch(()=>{});return}if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('Daily report copied. Paste it into WhatsApp.')).catch(()=>alert(text));}else alert(text)}
function saveTxt(){let text=dailyReportText(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download='Mission99-Day-'+form().day+'-'+(form().date||'report')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printDailyReport(){let text=dailyReportText();let w=window.open('','_blank');if(!w){alert('Allow pop-ups for Mission 99 to create the PDF.');return}w.document.write('<!doctype html><html><head><title>Mission 99 Day '+form().day+'</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Arial,sans-serif;padding:28px;line-height:1.55;color:#111}h1{font-size:24px}pre{white-space:pre-wrap;font:15px/1.6 Arial,sans-serif}@media print{body{padding:12px}}</style></head><body><h1>⚔️ Mission 99 — Daily Report</h1><pre>'+esc(text)+'</pre></body></html>');w.document.close();setTimeout(()=>w.print(),350)}
function open(id){$(id).classList.add('open')}document.querySelectorAll('.foldHead').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));renderSections();$('date').value=iso();let ws=$('weekSelect');for(let w=1;w<=15;w++)ws.innerHTML+=`<option value="${w}">Week ${w} · Days ${(w-1)*7+1}–${Math.min(99,w*7)}</option>`;let ms=$('monthSelect');['September 2026','October 2026','November 2026','December 2026'].forEach((x,i)=>ms.innerHTML+=`<option value="${i}">${x}</option>`);$('save').onclick=()=>{save();alert('Mission 99 Day '+$('day').value+' saved.')};$('load').onclick=load;$('new').onclick=()=>reset(Math.min(99,(+$('day').value||1)+1));$('delete').onclick=()=>del(+$('day').value||1);$('shareReport').onclick=shareDailyReport;$('txtReport').onclick=saveTxt;$('pdfReport').onclick=printDailyReport;$('export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(records,null,2)],{type:'application/json'}));a.download='mission99-data.json';a.click()};$('reviewBtn').onclick=reviewDay;$('weekBtn').onclick=reports;$('monthBtn').onclick=reports;$('overallBtn').onclick=reports;['day','date','studyH','studyM','bed','wake'].forEach(id=>$(id).addEventListener('input',calc));renderHistory();reviewDay();reports();calc();
