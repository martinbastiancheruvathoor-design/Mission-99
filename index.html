function load(){let d=+$('day').value||1,r=records.find(x=>x.day===d);if(!r){alert('No saved entry for Day '+d+'.');return false}$('date').value=r.date||iso();let a=[...document.querySelectorAll('.m')];a.forEach((x,i)=>x.value=Number(r.marks?.[i])||0);$('studyH').value=r.studyH??0;$('studyM').value=r.studyM??0;$('bed').value=r.bed||'';$('wake').value=r.wake||'';$('win').value=r.win||'';$('lesson').value=r.lesson||'';$('tomorrow').value=r.tomorrow||'';sync();applyLock(r.completedAt||'');if(r.date){selectedCalDate=r.date;let dd=new Date(r.date+'T00:00:00');calCursor=new Date(dd.getFullYear(),dd.getMonth(),1);renderCalendar()}return true}
function reset(d){d=Math.max(1,Math.min(99,Number(d)||1));$('day').value=d;$('date').value=iso();document.querySelectorAll('.m').forEach(x=>x.value=0);$('studyH').value=0;$('studyM').value=0;$('bed').value='';$('wake').value='';$('win').value='';$('lesson').value='';$('tomorrow').value='';sync();applyLock('');document.body.classList.remove('locked');document.querySelectorAll('#sections .pillar.open').forEach(x=>x.classList.remove('open'));return true}
function reviewDay(){let d=+$('reviewDay').value||1,r=records.find(x=>x.day===d),el=$('dayReview');if(!r){el.innerHTML='<div class="empty">No completed record for Day '+d+'.</div>';return}let pos=0;let html='<div class="stats"><div class="stat"><small>TOTAL</small><b>'+r.total+'/105</b></div><div class="stat"><small>DATE</small><b>'+esc(r.date||'—')+'</b></div><div class="stat"><small>STATUS</small><b>✓ Complete</b></div></div>';html+='<div class="chart">'+sections.map((s,i)=>'<div class="barrow"><span>'+esc(s[1])+'</span><div class="bar"><div class="fill" style="width:'+Math.min(100,(r.pillars?.[i]||0)/s[2]*100)+'%"></div></div><b>'+(r.pillars?.[i]||0)+'/'+s[2]+'</b></div>').join('')+'</div>';sections.forEach((s,i)=>{html+='<div class="mini" style="margin-top:9px"><strong>'+s[0]+' '+esc(s[1])+' — '+(r.pillars?.[i]||0)+'/'+s[2]+'</strong>';s[3].forEach((q,j)=>{html+='<div class="histSub" style="margin-top:7px">'+(j+1)+'. '+esc(q)+' — <b>'+((r.marks||[])[pos++]||'—')+'/5</b></div>'});html+='</div>'});html+='<div class="mini" style="margin-top:9px"><strong>Night Review</strong><div class="histSub">🏆 Win: '+esc(r.win||'—')+'</div><div class="histSub">🧠 Lesson: '+esc(r.lesson||'—')+'</div><div class="histSub">🎯 Tomorrow: '+esc(r.tomorrow||'—')+'</div><div class="histSub">🕐 Completed: '+esc(r.completedAt?new Date(r.completedAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'—')+'</div></div>';el.innerHTML=html}
function del(d){if(!records.some(r=>r.day===d)){alert('No saved entry for Day '+d+'.');return}if(confirm('Delete the saved entry for Day '+d+'? This cannot be undone.')){records=records.filter(r=>r.day!==d);localStorage.setItem(key,JSON.stringify(records));reset(d);renderHistory();reports();reviewDay()}}
function renderHistory(){let h=$('history');$('histHint').textContent=records.length+' day'+(records.length===1?'':'s');h.innerHTML=records.length?records.map(r=>`<div class="hist"><div data-review="${r.day}"><div class="histTitle">Day ${r.day} · ${esc(r.date)} · ${r.total}/105</div><div class="histSub">${r.completedAt?'Completed '+esc(new Date(r.completedAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})):'Saved entry'}</div></div><div class="histActions"><button class="edit" data-edit="${r.day}">✏️</button><button class="del" data-del="${r.day}">🗑</button></div></div>`).join(''):'<div class="empty">No saved days yet.</div>';document.querySelectorAll('[data-review]').forEach(e=>e.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();$('reviewDay').value=e.dataset.review;reviewDay();open('reviewCard')});document.querySelectorAll('[data-edit]').forEach(e=>e.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();const d=Number(e.dataset.edit);$('day').value=d;const ok=load();if(ok){document.body.classList.remove('locked');$('complete').textContent='✓ Save Changes';$('completionStamp').textContent='✏️ Editing Day '+d+' — complete again to save the corrected record';$('completionStamp').dataset.iso='';document.querySelector('.actionDock')?.classList.add('open');window.scrollTo({top:0,behavior:'smooth'});}});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();del(+e.dataset.del)})}
function bar(items,title,max){if(!items.length)return'';return`<div class="chart"><b>${title}</b>`+items.map(x=>`<div class="barrow"><span>${esc(x.label)}</span><div class="bar"><div class="fill" style="width:${Math.min(100,x.value/max*100)}%"></div></div><b>${x.display}</b></div>`).join('')+'</div>'}
function range(list,title){if(!list.length)return`<div class="empty">No saved days in ${title}.</div>`;let avg=Math.round(list.reduce((a,r)=>a+r.total,0)/list.length),study=list.reduce((a,r)=>a+r.studyH*60+r.studyM,0),sl=list.reduce((a,r)=>a+sleep(r.bed,r.wake),0),sums=[0,0,0,0,0];list.forEach(r=>r.pillars.forEach((v,i)=>sums[i]+=v));return`<div class="stats"><div class="stat"><small>LOGGED</small><b>${list.length}</b></div><div class="stat"><small>AVERAGE</small><b>${avg}/105</b></div><div class="stat"><small>STUDY</small><b>${fm(study)}</b></div></div>`+bar(sums.map((v,i)=>({label:sections[i][1],value:(v/list.length)/sections[i][2]*10,display:Math.round(v/list.length)+'/'+sections[i][2]})),'Average pillar score',10)+`<div class="empty">Highest: Day ${list.reduce((a,b)=>b.total>a.total?b:a).day} · Lowest: Day ${list.reduce((a,b)=>b.total<a.total?b:a).day} · Average sleep: ${fm(Math.round(sl/list.length))}</div>`}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function saveCalendarStore(){localStorage.setItem(calendarKey,JSON.stringify(calendarNotes))}
function renderCalendar(){let y=calCursor.getFullYear(),m=calCursor.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),start=(first.getDay()+6)%7;$('calMonth').textContent=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});let g=$('calendarGrid');let out=['<div class="calDow">MON</div><div class="calDow">TUE</div><div class="calDow">WED</div><div class="calDow">THU</div><div class="calDow">FRI</div><div class="calDow">SAT</div><div class="calDow">SUN</div>'];for(let i=0;i<start;i++)out.push('<button class="calDay muted" type="button" disabled> </button>');for(let d=1;d<=days;d++){let k=dateKey(new Date(y,m,d)),n=calendarNotes[k],sel=k===selectedCalDate;out.push(`<button class="calDay ${sel?'sel ':''}${n?'hasNote':''}" type="button" data-caldate="${k}">${d}</button>`)}g.innerHTML=out.join('');document.querySelectorAll('[data-caldate]').forEach(b=>b.onclick=()=>selectCalDate(b.dataset.caldate));renderCalendarFields();renderCalendarList()}
function selectCalDate(k){selectedCalDate=k;let d=new Date(k+'T00:00:00');calCursor=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar()}
function renderCalendarFields(){let d=new Date(selectedCalDate+'T00:00:00'),n=calendarNotes[selectedCalDate]||{};$('selectedDateLabel').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});$('dailyNotes').value=n.notes||'';$('dailyReminder').value=n.reminder||'';$('reminderTime').value=n.time||'';$('reminderStatus').textContent=n.time?'Reminder saved for '+n.time+(n.notify?' · notification enabled':''):''}
function renderCalendarList(){let items=Object.entries(calendarNotes).filter(([k,v])=>v&&(v.notes||v.reminder||v.time)).sort(([a],[b])=>a.localeCompare(b)).slice(0,12);$('calendarList').innerHTML=items.length?'<div class="label">UPCOMING / RECENT NOTES</div>'+items.map(([k,v])=>`<div class="eventItem"><div class="eventDate">${esc(new Date(k+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'}))}${v.time?' · '+esc(v.time):''}</div><div class="eventText">${esc(v.reminder||v.notes)}</div></div>`).join(''):''}
async function saveCalendarNote(){let notes=$('dailyNotes').value.trim(),reminder=$('dailyReminder').value.trim(),time=$('reminderTime').value,notify=false;if(time&&('Notification'in window)){if(Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}notify=Notification.permission==='granted'}if(!notes&&!reminder&&!time){delete calendarNotes[selectedCalDate]}else calendarNotes[selectedCalDate]={notes,reminder,time,notify,updatedAt:new Date().toISOString()};saveCalendarStore();renderCalendar();scheduleReminder();$('reminderStatus').textContent=time?'Saved '+time+(notify?' · notification enabled':' · reminder saved'): 'Saved for this date'}
function scheduleReminder(){if(reminderTimer)clearInterval(reminderTimer);reminderTimer=setInterval(()=>{let now=new Date(),k=dateKey(now),n=calendarNotes[k];if(!n||!n.time||n.fired)return;let hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');if(hhmm===n.time&&n.notify&&'Notification'in window&&Notification.permission==='granted'){new Notification('Mission 99 — Reminder',{body:n.reminder||n.notes||'Important item for today'});n.fired=true;saveCalendarStore()}},30000)}
function lineGraph(list){if(!list.length)return '<div class="empty">Complete days to build your performance graph.</div>';let w=680,h=260,pad=34;let pts=list.map((r,i)=>{let x=list.length===1?w/2:pad+(w-2*pad)*i/(list.length-1);let y=h-pad-(h-2*pad)*(r.total/105);return {x,y,r}});let path=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');let circles=pts.map(p=>'<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="#2563eb"><title>Day '+p.r.day+': '+p.r.total+'/105</title></circle>').join('');let labels='';let step=Math.max(1,Math.ceil(list.length/8));for(let i=0;i<list.length;i+=step){let p=pts[i];labels+='<text x="'+p.x.toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" font-size="10" fill="#667085">D'+list[i].day+'</text>'}return '<div class="chart"><b>📈 Mission 99 performance</b><div class="noteMeta">Daily score out of 105 · growth or decline across completed days</div><svg viewBox="0 0 '+w+' '+h+'" width="100%" role="img" aria-label="Mission 99 daily performance graph" style="display:block;margin-top:8px;overflow:visible"><line x1="'+pad+'" y1="'+(h-pad)+'" x2="'+(w-pad)+'" y2="'+(h-pad)+'" stroke="#d0d5dd"/><line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(h-pad)+'" stroke="#d0d5dd"/><text x="8" y="'+(pad+4)+'" font-size="10" fill="#667085">105</text><text x="14" y="'+(h-pad+4)+'" font-size="10" fill="#667085">0</text><path d="'+path+'" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+circles+labels+'</svg></div>'}
function reports(){let overall=records;$("overallReport").innerHTML=lineGraph(overall)}
function reportRecord(){let d=+$('day').value||1;return records.find(x=>x.day===d)||form()}
function dailyReportText(){let r=reportRecord(), lines=['⚔️ MISSION 99 — DAILY REPORT','DAY '+r.day+' / 99','DATE: '+(r.date||'—'),'','🔥 TOTAL: '+r.total+'/105','✓ COMPLETED: '+(r.completedAt?new Date(r.completedAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'—'),''];let pos=0;sections.forEach((s,i)=>{lines.push(s[0]+' '+s[1].toUpperCase()+': '+r.pillars[i]+'/'+s[2]);s[3].forEach((q,j)=>{lines.push('   '+(j+1)+'. '+q+' — '+r.marks[pos++]+'/5')});lines.push('')});lines.push('📚 STUDY TIME: '+r.studyH+'h '+r.studyM+'m','💤 SLEEP: '+(sleep(r.bed,r.wake)?fm(sleep(r.bed,r.wake)):'—'),'🛏️ BED: '+(r.bed||'—'),'⏰ WAKE: '+(r.wake||'—'),'','🏆 WIN: '+(r.win||'—'),'🧠 LESSON: '+(r.lesson||'—'),'🎯 TOMORROW: '+(r.tomorrow||'—'),'','📝 DAILY NOTES: '+(r.dailyNotes||'—'),'🔔 CALENDAR REMINDER: '+(r.calendarReminder||'—'),'','Measure honestly • Correct daily • Repeat','— Mission 99');return lines.join('\n')}
function shareDailyReport(){let text=dailyReportText();if(navigator.share){navigator.share({title:'Mission 99 — Day '+reportRecord().day, text}).catch(()=>{});return}if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('Daily report copied. Paste it into WhatsApp.')).catch(()=>alert(text));}else alert(text)}
function open(id){document.querySelectorAll('.fold.open').forEach(f=>{if(f.id!==id)f.classList.remove('open')});$(id).classList.add('open')}document.querySelectorAll('.foldHead').forEach(b=>b.onclick=()=>{const card=b.parentElement;const wasOpen=card.classList.contains('open');document.querySelectorAll('.fold.open').forEach(f=>f.classList.remove('open'));if(!wasOpen)card.classList.add('open')});$('actionToggle').onclick=()=>$('actionDock').classList.toggle('open');renderSections();$('date').value=iso();$('calPrev').onclick=()=>{calCursor.setMonth(calCursor.getMonth()-1);renderCalendar()};$('calNext').onclick=()=>{calCursor.setMonth(calCursor.getMonth()+1);renderCalendar()};$('saveCalendarNote').onclick=saveCalendarNote;renderCalendar();scheduleReminder();$('complete').onclick=completeDay;$('load').onclick=load;$('new').onclick=()=>reset(Math.min(99,(+$('day').value||1)+1));$('delete').onclick=()=>del(+$('day').value||1);$('shareReport').onclick=shareDailyReport;$('reviewBtn').onclick=reviewDay;$('overallBtn').onclick=reports;['day','date','studyH','studyM','bed','wake'].forEach(id=>$(id).addEventListener('input',calc));renderHistory();reviewDay();reports();calc();
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('install').style.display='block'});$('install').onclick=async()=>{if(!dip){alert('Use Chrome menu → Add to Home screen / Install app.');return}dip.prompt();await dip.userChoice;dip=null};if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?nightreview=2',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
